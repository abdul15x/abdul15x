<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04070D"/>
      <stop offset="0.35" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#090E18"/>
    </linearGradient>
    <linearGradient id="neon" x1="120" y1="20" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
